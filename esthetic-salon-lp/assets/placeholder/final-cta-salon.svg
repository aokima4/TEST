<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" role="img" aria-label="自然光の入る明るいエステサロンの空間">
<defs>
  <linearGradient id="wall" x1="0.1" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FCF8F2"/><stop offset="0.55" stop-color="#F3ECE1"/><stop offset="1" stop-color="#E8DBC9"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE6D8"/><stop offset="1" stop-color="#E2D5C1"/></linearGradient>
  <radialGradient id="fsun" cx="0.16" cy="0.06" r="0.7"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#FFF6E2" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6E2" stop-opacity="0"/></linearGradient>
  <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E8DB"/></linearGradient>

  <!-- 写真的な奥行き（背景ボケ） -->
  <filter id="bgblur" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="midblur" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
  <!-- 粒状感（フィルムグレイン） -->
  <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <!-- やわらかい落ち影 -->
  <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6B5942" flood-opacity="0.16"/>
  </filter>
  <!-- 暖色のグロー -->
  <radialGradient id="warmglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE6B4" stop-opacity="0.62"/><stop offset="1" stop-color="#FFE6B4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
    <stop offset="0.46" stop-color="#4A3B28" stop-opacity="0"/><stop offset="1" stop-color="#5A4830" stop-opacity="0.26"/>
  </radialGradient>
</defs>
<rect width="2000" height="1000" fill="url(#wall)"/>
<!-- 床 -->
<path d="M0 690 H2000 V1000 H0 Z" fill="url(#floor)"/>
<rect y="690" width="2000" height="6" fill="#FFFFFF" opacity=".8"/>
<rect width="2000" height="1000" fill="url(#fsun)"/>

<g filter="url(#bgblur)">
<!-- 左：大きな窓 -->
<g>
  <rect x="86" y="60" width="420" height="630" rx="10" fill="#FFFDF8"/>
  <rect x="86" y="60" width="420" height="630" rx="10" fill="none" stroke="#DCCDB4" stroke-width="8"/>
  <line x1="296" y1="60" x2="296" y2="690" stroke="#DCCDB4" stroke-width="8"/>
  <line x1="86" y1="376" x2="506" y2="376" stroke="#DCCDB4" stroke-width="8"/>
  <!-- 窓の外のグリーン -->
  <g opacity=".45" fill="#A9B59D">
    <circle cx="180" cy="200" r="62"/><circle cx="240" cy="250" r="48"/><circle cx="140" cy="270" r="42"/>
    <circle cx="400" cy="480" r="54"/><circle cx="350" cy="540" r="40"/><circle cx="446" cy="540" r="36"/>
  </g>
</g>
</g>
<!-- 光の帯（床） -->
<path d="M110 690 L506 690 L760 1000 L250 1000 Z" fill="url(#beam)" opacity=".75"/>
<path d="M540 690 L700 690 L860 1000 L640 1000 Z" fill="url(#beam)" opacity=".35"/>

<!-- 窓辺のオリーブ -->
<g>
  <path d="M540 690 h120 l-16 160 h-88 z" fill="#EDE3D3"/>
  <g stroke="#9CA992" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M600 690 C600 560 556 500 516 452"/><path d="M600 690 C600 584 650 528 694 484"/><path d="M600 690 C600 600 600 540 600 484"/></g>
  <g fill="#AEB9A2">
    <ellipse cx="508" cy="440" rx="40" ry="19" transform="rotate(-40 508 440)"/><ellipse cx="702" cy="472" rx="40" ry="19" transform="rotate(38 702 472)"/>
    <ellipse cx="600" cy="468" rx="34" ry="16"/><ellipse cx="546" cy="546" rx="34" ry="16" transform="rotate(-26 546 546)"/>
    <ellipse cx="658" cy="562" rx="34" ry="16" transform="rotate(24 658 562)"/><ellipse cx="600" cy="600" rx="30" ry="14"/></g>
</g>

<!-- 中央：施術ベッド -->
<g>
  <ellipse cx="1160" cy="906" rx="380" ry="46" fill="#D9CBB5" opacity=".45"/>
  <rect x="858" y="654" width="600" height="150" rx="34" fill="url(#bed)" filter="url(#softshadow)"/>
  <rect x="858" y="654" width="600" height="52" rx="26" fill="#FFFFFF"/>
  <!-- 枕 -->
  <rect x="896" y="606" width="190" height="62" rx="31" fill="#F7F2E9"/>
  <rect x="896" y="606" width="190" height="62" rx="31" fill="none" stroke="#EAE0CF" stroke-width="3"/>
  <!-- かけタオル -->
  <path d="M1180 690 h240 v100 a26 26 0 0 1 -26 26 h-188 a26 26 0 0 1 -26 -26 z" fill="#F4EDE2"/>
  <line x1="1180" y1="730" x2="1420" y2="730" stroke="#E7DCC9" stroke-width="4"/>
  <!-- ロールタオル -->
  <g><ellipse cx="1370" cy="640" rx="30" ry="30" fill="#FFFFFF"/><ellipse cx="1370" cy="640" rx="14" ry="14" fill="#F2EADC"/>
     <ellipse cx="1428" cy="640" rx="30" ry="30" fill="#FBF7F0"/><ellipse cx="1428" cy="640" rx="14" ry="14" fill="#F2EADC"/></g>
  <!-- 脚 -->
  <rect x="906" y="804" width="22" height="104" fill="#E0D3BE"/><rect x="1388" y="804" width="22" height="104" fill="#E0D3BE"/>
  <rect x="898" y="900" width="520" height="14" rx="7" fill="#DCCEB8"/>
</g>

<!-- スツール -->
<g>
  <ellipse cx="790" cy="900" rx="70" ry="16" fill="#D9CBB5" opacity=".4"/>
  <ellipse cx="790" cy="790" rx="66" ry="22" fill="#F3EBDE"/>
  <rect x="724" y="790" width="132" height="34" fill="#EDE3D2"/>
  <path d="M724 824 a66 22 0 0 0 132 0 z" fill="#E6DAC6"/>
  <rect x="782" y="824" width="16" height="72" fill="#D9CBB5"/>
  <ellipse cx="790" cy="898" rx="50" ry="12" fill="#D9CBB5"/>
</g>

<g filter="url(#midblur)">
<!-- 右：丸ミラー -->
<g>
  <circle cx="1700" cy="300" r="164" fill="#F6E9D2" opacity=".45"/>
  <circle cx="1700" cy="300" r="142" fill="#FBF5EB"/>
  <path d="M1700 158 A142 142 0 0 1 1842 300" fill="none" stroke="#FFFFFF" stroke-width="12" opacity=".8" stroke-linecap="round"/>
  <circle cx="1700" cy="300" r="142" fill="none" stroke="#C7AB80" stroke-width="6"/>
</g>
<!-- 右：シェルフ＋ボトル -->
<g>
  <rect x="1548" y="556" width="336" height="8" rx="4" fill="#D5C1A0"/>
  <g fill="#FAF4EA" stroke="#DED0B6" stroke-width="3">
    <rect x="1578" y="470" width="44" height="86" rx="9"/><rect x="1642" y="494" width="34" height="62" rx="8"/>
    <rect x="1696" y="458" width="48" height="98" rx="10"/><rect x="1764" y="490" width="32" height="66" rx="8"/>
    <rect x="1818" y="474" width="42" height="82" rx="9"/>
  </g>
  <g fill="#C4A87C"><rect x="1586" y="458" width="28" height="14" rx="5"/><rect x="1706" y="446" width="28" height="14" rx="5"/><rect x="1826" y="462" width="26" height="13" rx="5"/></g>
</g>
</g>
<!-- 右：ワゴン -->
<g>
  <rect x="1620" y="660" width="230" height="10" rx="5" fill="#D8C6A6"/>
  <rect x="1620" y="772" width="230" height="10" rx="5" fill="#D8C6A6"/>
  <rect x="1628" y="660" width="8" height="220" fill="#D8C6A6"/><rect x="1834" y="660" width="8" height="220" fill="#D8C6A6"/>
  <rect x="1666" y="604" width="50" height="58" rx="10" fill="#FBF7F1" stroke="#E6DDCD" stroke-width="3"/>
  <rect x="1740" y="620" width="60" height="42" rx="8" fill="#F4EDE2"/>
  <g><ellipse cx="1700" cy="772" rx="26" ry="26" fill="#FFFFFF"/><ellipse cx="1700" cy="772" rx="12" ry="12" fill="#F2EADC"/></g>
  <rect x="1752" y="742" width="70" height="30" rx="8" fill="#F6F0E6"/>
  <circle cx="1640" cy="890" r="12" fill="#CFBFA3"/><circle cx="1830" cy="890" r="12" fill="#CFBFA3"/>
</g>
<!-- 壁のアートフレーム -->
<g opacity=".5">
  <rect x="1120" y="150" width="180" height="240" fill="none" stroke="#CBB893" stroke-width="5"/>
  <path d="M1148 356 C1184 274 1210 302 1240 256 C1262 222 1272 302 1272 356 Z" fill="#DCCDB6"/>
  <circle cx="1168" cy="222" r="20" fill="#E4D6BE"/>
</g>
<!-- 床の反射 -->
<g opacity=".35" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M120 780 C300 762 420 800 600 782"/><path d="M1480 828 C1640 848 1780 816 1950 838"/>
</g>

<!-- 写真的な仕上げ：光・周辺減光・粒状感 -->
<rect width="2000" height="1000" fill="url(#vig)"/>
<rect width="2000" height="1000" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
