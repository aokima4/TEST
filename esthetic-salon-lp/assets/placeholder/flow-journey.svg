<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="ロゴ、ホームページ、Instagram、予約カレンダー、口コミの星、来店するお客様が段状の石の台に並び、銅色の矢印でつながっている様子">
<defs>
  <linearGradient id="jw" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#F4E6D0"/><stop offset="0.55" stop-color="#E9D5B9"/><stop offset="1" stop-color="#DCC5A3"/>
  </linearGradient>
  <linearGradient id="terra" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#C3866A"/><stop offset="0.5" stop-color="#B0704F"/><stop offset="1" stop-color="#95583B"/>
  </linearGradient>
  <linearGradient id="archG" x1="0.2" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#F8DEBB"/><stop offset="0.55" stop-color="#E9BA8D"/><stop offset="1" stop-color="#CF9366"/>
  </linearGradient>
  <linearGradient id="stoneTop" x1="0" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#F9F1E2"/><stop offset="1" stop-color="#EBDDC5"/>
  </linearGradient>
  <linearGradient id="stoneFace" x1="0" y1="0" x2="0.8" y2="0.5">
    <stop offset="0" stop-color="#EADCC4"/><stop offset="0.55" stop-color="#DECBAC"/><stop offset="1" stop-color="#C9B48D"/>
  </linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DBA071"/><stop offset="0.5" stop-color="#B87A4E"/><stop offset="1" stop-color="#985E37"/>
  </linearGradient>
  <linearGradient id="cream" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#FEFAF1"/><stop offset="1" stop-color="#F1E5CF"/>
  </linearGradient>
  <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#84996A"/><stop offset="1" stop-color="#566A3E"/>
  </linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="1" y2="0.5">
    <stop offset="0" stop-color="#EEDEC4"/><stop offset="1" stop-color="#C6AC87"/>
  </linearGradient>
  <filter id="jsoft" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
    <feDropShadow dx="18" dy="16" stdDeviation="16" flood-color="#7C5734" flood-opacity="0.3"/>
  </filter>
  <filter id="jblur2" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="jgrain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/>
  </filter>
  <radialGradient id="jvig" cx="0.42" cy="0.36" r="0.86">
    <stop offset="0.44" stop-color="#4A3418" stop-opacity="0"/><stop offset="1" stop-color="#4A3418" stop-opacity="0.3"/>
  </radialGradient>
  <radialGradient id="jsun" cx="0.14" cy="0.02" r="0.72">
    <stop offset="0" stop-color="#FFF9EA" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF9EA" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ============ 壁 ============ -->
<rect width="1600" height="900" fill="url(#jw)"/>
<rect width="1600" height="900" fill="url(#jsun)"/>

<!-- 葉の影 -->
<g fill="#8A6540" opacity="0.12" filter="url(#jblur2)">
  <g transform="rotate(-22 240 140)">
    <ellipse cx="110" cy="110" rx="136" ry="26"/><ellipse cx="192" cy="168" rx="118" ry="23"/>
    <ellipse cx="66"  cy="192" rx="106" ry="21"/><ellipse cx="248" cy="84"  rx="100" ry="20"/>
    <ellipse cx="164" cy="34"  rx="114" ry="21"/><ellipse cx="32"  cy="62"  rx="90"  ry="18"/>
  </g>
  <g transform="rotate(-14 720 74)">
    <ellipse cx="640" cy="40" rx="106" ry="20"/><ellipse cx="742" cy="94" rx="94" ry="18"/>
  </g>
</g>

<!-- ============ 右：テラコッタの壁とアーチ ============ -->
<g>
  <rect x="1286" y="0" width="314" height="900" fill="url(#terra)"/>
  <rect x="1286" y="0" width="44" height="900" fill="#7E4A31" opacity="0.22"/>
  <path d="M1352 500 V322 a108 108 0 0 1 216 0 V500 Z" fill="url(#archG)"/>
  <path d="M1352 500 V322 a108 108 0 0 1 216 0 V500 Z" fill="none" stroke="#8A5233" stroke-width="5" opacity="0.32"/>
  <path d="M1352 500 V360 a108 108 0 0 1 96 -76 L1470 500 Z" fill="#FFE9C4" opacity="0.34"/>
</g>

<!-- ============ 段状の石の台 ============ -->
<g>
