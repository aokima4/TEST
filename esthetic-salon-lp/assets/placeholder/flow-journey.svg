  <path d="M1060 900 V500 H1600 V900 Z" fill="url(#stoneFace)"/>
  <path d="M1060 500 H1600 V472 H1032 Z" fill="url(#stoneTop)"/>
  <!-- D -->
  <path d="M810 900 V552 H1080 V900 Z" fill="url(#stoneFace)"/>
  <path d="M810 552 H1080 V524 H784 Z" fill="url(#stoneTop)"/>
  <!-- C -->
  <path d="M560 900 V600 H830 V900 Z" fill="url(#stoneFace)"/>
  <path d="M560 600 H830 V574 H536 Z" fill="url(#stoneTop)"/>
  <!-- B -->
  <path d="M290 900 V656 H580 V900 Z" fill="url(#stoneFace)"/>
  <path d="M290 656 H580 V630 H266 Z" fill="url(#stoneTop)"/>
  <!-- A -->
  <path d="M0 900 V720 H310 V900 Z" fill="url(#stoneFace)"/>
  <path d="M0 720 H310 V696 H0 Z" fill="url(#stoneTop)"/>
  <!-- 石の粒感 -->
  <g fill="#C2A87F" opacity="0.26">
    <circle cx="90" cy="790" r="3"/><circle cx="196" cy="842" r="2.4"/><circle cx="248" cy="756" r="3"/>
    <circle cx="360" cy="740" r="2.6"/><circle cx="470" cy="820" r="3"/><circle cx="520" cy="700" r="2.4"/>
    <circle cx="640" cy="668" r="2.8"/><circle cx="760" cy="780" r="2.6"/><circle cx="880" cy="628" r="3"/>
    <circle cx="1000" cy="720" r="2.5"/><circle cx="1140" cy="586" r="2.8"/><circle cx="1250" cy="680" r="2.4"/>
  </g>
  <!-- 段の内側の影 -->
  <g fill="#9A7A4E" opacity="0.14">
    <rect x="290" y="656" width="290" height="16"/><rect x="560" y="600" width="270" height="16"/>
    <rect x="810" y="552" width="270" height="16"/><rect x="1060" y="500" width="540" height="16"/>
  </g>
</g>

