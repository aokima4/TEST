<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="エステサロン開業まるごとパック">
<defs>
  <linearGradient id="og" x1="0.1" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#FDFAF6"/><stop offset="0.55" stop-color="#F4EDE3"/><stop offset="1" stop-color="#E8DCCB"/></linearGradient>
  <radialGradient id="ogs" cx="0.18" cy="0.08" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

  <linearGradient id="floorFall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7A5A2E" stop-opacity="0"/><stop offset="1" stop-color="#7A5A2E" stop-opacity="0.15"/>
  </linearGradient>
  <radialGradient id="bloomW" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE7B6" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE7B6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vigW" cx="0.46" cy="0.4" r="0.82">
    <stop offset="0.42" stop-color="#4A3418" stop-opacity="0"/><stop offset="1" stop-color="#4A3418" stop-opacity="0.3"/>
  </radialGradient>
  <filter id="grainW" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>
<rect width="1200" height="630" fill="url(#og)"/><rect width="1200" height="630" fill="url(#ogs)"/>
<!-- 右：サロンのモチーフ -->
<g opacity=".9">
  <circle cx="990" cy="210" r="118" fill="#F7EBD6"/><circle cx="990" cy="210" r="100" fill="#FCF7EE"/>
  <circle cx="990" cy="210" r="100" fill="none" stroke="#C7AB80" stroke-width="4"/>
  <path d="M990 110 A100 100 0 0 1 1090 210" fill="none" stroke="#fff" stroke-width="10" opacity=".8" stroke-linecap="round"/>
  <rect x="892" y="392" width="264" height="10" rx="5" fill="#D5C1A0"/>
  <g fill="#FAF4EA" stroke="#DED0B6" stroke-width="3">
    <rect x="916" y="330" width="36" height="62" rx="8"/><rect x="966" y="346" width="28" height="46" rx="7"/>
    <rect x="1010" y="322" width="38" height="70" rx="9"/><rect x="1064" y="344" width="26" height="48" rx="7"/>
    <rect x="1106" y="332" width="34" height="60" rx="8"/>
  </g>
  <g fill="#C4A87C"><rect x="922" y="320" width="24" height="12" rx="4"/><rect x="1018" y="312" width="24" height="12" rx="4"/></g>
  <g stroke="#5F7347" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M876 560 C876 486 848 452 824 424"/><path d="M876 560 C876 498 906 466 934 440"/></g>
  <g fill="#7E9463"><ellipse cx="818" cy="416" rx="28" ry="13" transform="rotate(-40 818 416)"/><ellipse cx="940" cy="432" rx="28" ry="13" transform="rotate(38 940 432)"/><ellipse cx="876" cy="440" rx="24" ry="12"/></g>
  <path d="M846 560 h62 l-9 62 h-44 z" fill="#EDE3D3"/>
</g>
<!-- 左：テキスト -->
<g>
  <text x="86" y="152" font-family="Georgia,serif" font-size="21" letter-spacing="7.5" fill="#B59A70">ESTHETIC SALON STARTUP PACKAGE</text>
  <line x1="86" y1="182" x2="200" y2="182" stroke="#C7AB80" stroke-width="2"/>
  <text x="86" y="278" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="54" letter-spacing="3" fill="#393532">エステの技術はある。</text>
  <text x="86" y="360" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="54" letter-spacing="3" fill="#393532">あとは、<tspan fill="#B59A70">“選ばれるサロン”</tspan></text>
  <text x="86" y="442" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="54" letter-spacing="3" fill="#393532">にするだけ。</text>
  <text x="86" y="516" font-family="'Noto Sans JP',sans-serif" font-size="22" letter-spacing="1.5" fill="#6B645E">ロゴ・ホームページ・Instagram・LINE・予約導線まで。</text>
  <rect x="86" y="546" width="330" height="54" rx="27" fill="#393532"/>
  <text x="251" y="580" font-family="'Noto Sans JP',sans-serif" font-size="20" letter-spacing="2" fill="#FFF9F0" text-anchor="middle">無料で開業相談をする</text>
</g>

<!-- 暖色グレードと仕上げ -->
<ellipse cx="240" cy="75" rx="744" ry="390" fill="url(#bloomW)" opacity="0.24"/>
<rect width="1200" height="630" fill="#C98F3A" opacity="0.08" style="mix-blend-mode:multiply"/>
<rect x="0" y="516" width="1200" height="113" fill="url(#floorFall)"/>
<rect width="1200" height="630" fill="url(#vigW)"/>
<rect width="1200" height="630" filter="url(#grainW)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
