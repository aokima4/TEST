<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="公式LINEの予約メッセージとリッチメニューが表示されたスマートフォン">
<defs>
  <linearGradient id="g2" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#FCF9F4"/><stop offset="1" stop-color="#E9DFD1"/></linearGradient>
  <radialGradient id="s2" cx="0.7" cy="0.1" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="desk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFE6D9"/></linearGradient>

  <filter id="bgblur" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6B5942" flood-opacity="0.18"/>
  </filter>
  <radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
    <stop offset="0.46" stop-color="#4A3B28" stop-opacity="0"/><stop offset="1" stop-color="#5A4830" stop-opacity="0.24"/>
  </radialGradient>

  <linearGradient id="floorFall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7A5A2E" stop-opacity="0"/><stop offset="1" stop-color="#7A5A2E" stop-opacity="0.15"/>
  </linearGradient>
  <radialGradient id="bloomW" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE7B6" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE7B6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vigW" cx="0.46" cy="0.4" r="0.82">
    <stop offset="0.42" stop-color="#4A3418" stop-opacity="0"/><stop offset="1" stop-color="#4A3418" stop-opacity="0.3"/>
  </radialGradient>
  <filter id="grainW" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>
<rect width="800" height="600" fill="url(#g2)"/><rect width="800" height="600" fill="url(#s2)"/>
<g filter="url(#bgblur)">
<!-- 木のルーバー壁 -->
<g opacity=".35"><rect x="520" y="0" width="280" height="430" fill="#E6D9C6"/>
<g stroke="#D6C4A9" stroke-width="3"><line x1="556" y1="0" x2="556" y2="430"/><line x1="600" y1="0" x2="600" y2="430"/><line x1="644" y1="0" x2="644" y2="430"/><line x1="688" y1="0" x2="688" y2="430"/><line x1="732" y1="0" x2="732" y2="430"/><line x1="776" y1="0" x2="776" y2="430"/></g></g>
</g>
<!-- デスク -->
<path d="M0 430 H800 V600 H0 Z" fill="url(#desk2)"/><rect y="430" width="800" height="8" fill="#fff"/>
<g stroke="#E6DCCB" stroke-width="2" fill="none" opacity=".7"><path d="M40 500 C140 484 190 524 280 508"/><path d="M520 478 C610 500 690 472 776 492"/></g>
<!-- 観葉植物 -->
<g><path d="M96 430 h78 l-11 84 h-56 z" fill="#EDE3D3"/>
<g stroke="#5F7347" stroke-width="5" fill="none" stroke-linecap="round"><path d="M135 430 C135 356 106 322 82 292"/><path d="M135 430 C135 368 166 336 194 308"/><path d="M135 430 C135 380 135 342 135 306"/></g>
<g fill="#7E9463"><ellipse cx="76" cy="284" rx="30" ry="14" transform="rotate(-40 76 284)"/><ellipse cx="200" cy="300" rx="30" ry="14" transform="rotate(36 200 300)"/><ellipse cx="135" cy="296" rx="26" ry="13"/><ellipse cx="102" cy="348" rx="26" ry="12" transform="rotate(-24 102 348)"/><ellipse cx="172" cy="358" rx="26" ry="12" transform="rotate(22 172 358)"/></g></g>
<!-- スマートフォン（スタンド立て） -->
<g>
  <ellipse cx="420" cy="536" rx="150" ry="22" fill="#E2D5C2" opacity=".45"/>
  <rect x="300" y="66" width="240" height="462" rx="36" fill="#F9F5EF" stroke="#DBD4C8" stroke-width="4" filter="url(#softshadow)"/>
  <rect x="314" y="82" width="212" height="430" rx="26" fill="#FFFFFF"/>
  <rect x="392" y="72" width="56" height="8" rx="4" fill="#DED7CC"/>
  <!-- ヘッダー -->
  <rect x="314" y="82" width="212" height="54" rx="26" fill="#F3EDE2"/><rect x="314" y="118" width="212" height="18" fill="#F3EDE2"/>
  <circle cx="348" cy="110" r="16" fill="#E3D5BD"/><rect x="374" y="102" width="82" height="9" rx="4.5" fill="#DCCEB6"/><rect x="374" y="118" width="52" height="7" rx="3.5" fill="#E6DBC7"/>
  <!-- 吹き出し -->
  <g>
    <path d="M330 160 h128 a14 14 0 0 1 14 14 v38 a14 14 0 0 1 -14 14 h-128 a14 14 0 0 1 -14 -14 v-38 a14 14 0 0 1 14 -14 z" fill="#F2ECE1"/>
    <rect x="330" y="176" width="102" height="7" rx="3.5" fill="#DFD3BF"/><rect x="330" y="192" width="76" height="7" rx="3.5" fill="#E8DECC"/>
    <path d="M364 250 h146 a14 14 0 0 1 14 14 v44 a14 14 0 0 1 -14 14 h-146 a14 14 0 0 1 -14 -14 v-44 a14 14 0 0 1 14 -14 z" fill="#B59A70"/>
    <rect x="366" y="268" width="118" height="7" rx="3.5" fill="#F6EEDF" opacity=".9"/>
    <rect x="366" y="284" width="86" height="7" rx="3.5" fill="#F6EEDF" opacity=".7"/>
    <rect x="366" y="300" width="102" height="12" rx="6" fill="#F8F2E6" opacity=".95"/>
  </g>
  <!-- リッチメニュー -->
  <g>
    <rect x="316" y="352" width="208" height="158" fill="#F6F1E7"/>
    <g stroke="#E4DACA" stroke-width="2"><line x1="316" y1="405" x2="524" y2="405"/><line x1="316" y1="458" x2="524" y2="458"/><line x1="385" y1="352" x2="385" y2="510"/><line x1="455" y1="352" x2="455" y2="510"/></g>
    <g fill="#C4A87C" opacity=".85">
      <circle cx="350" cy="378" r="11"/><rect x="410" y="369" width="20" height="18" rx="4"/><path d="M478 370 l12 18 h-24 z"/>
      <rect x="340" y="424" width="22" height="16" rx="3"/><circle cx="420" cy="432" r="10"/><rect x="480" y="424" width="20" height="16" rx="8"/>
      <rect x="338" y="478" width="24" height="14" rx="3"/><rect x="408" y="478" width="24" height="14" rx="7"/><circle cx="490" cy="485" r="9"/>
    </g>
  </g>
  <!-- スタンド -->
  <path d="M362 528 h116 l22 26 h-160 z" fill="#E6DCCB"/>
</g>
<!-- 小物 -->
<g><rect x="646" y="452" width="56" height="96" rx="12" fill="#FCF8F2" stroke="#E6DDCD" stroke-width="3"/><rect x="660" y="430" width="30" height="24" rx="6" fill="#C4A87C"/></g>
<g><g transform="rotate(-6 640 542)"><rect x="576" y="524" width="128" height="36" rx="5" fill="#FFFFFF"/><rect x="576" y="524" width="128" height="36" rx="5" fill="none" stroke="#EAE1D2" stroke-width="2"/><circle cx="600" cy="542" r="9" fill="none" stroke="#C4A87C" stroke-width="2"/><rect x="620" y="536" width="62" height="6" rx="3" fill="#E8DECC"/><rect x="620" y="548" width="40" height="5" rx="2.5" fill="#EFE7D9"/></g></g>

<!-- 暖色グレードと仕上げ -->
<ellipse cx="160" cy="72" rx="496" ry="372" fill="url(#bloomW)" opacity="0.24"/>
<rect width="800" height="600" fill="#C98F3A" opacity="0.08" style="mix-blend-mode:multiply"/>
<rect x="0" y="491" width="800" height="108" fill="url(#floorFall)"/>
<rect width="800" height="600" fill="url(#vigW)"/>
<rect width="800" height="600" filter="url(#grainW)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
