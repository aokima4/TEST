<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340" role="img" aria-label="サロンオーナーの女性が、大理石のカウンターでノートパソコンとスマートフォンを使っている様子">
<defs>
  <!-- ===== 空間の光 ===== -->
  <linearGradient id="wall" x1="0.05" y1="0" x2="0.75" y2="1">
    <stop offset="0"    stop-color="#FBF1E1"/>
    <stop offset="0.42" stop-color="#F2E2C9"/>
    <stop offset="1"    stop-color="#DFC7A4"/>
  </linearGradient>
  <radialGradient id="keylight" cx="0.14" cy="0.05" r="0.72">
    <stop offset="0"   stop-color="#FFFBF2" stop-opacity="0.96"/>
    <stop offset="0.5" stop-color="#FFF2D9" stop-opacity="0.45"/>
    <stop offset="1"   stop-color="#FFF2D9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"    stop-color="#FFE7B6" stop-opacity="0.9"/>
    <stop offset="0.45" stop-color="#FFDFA4" stop-opacity="0.34"/>
    <stop offset="1"    stop-color="#FFDFA4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mirrorFace" cx="0.32" cy="0.26" r="0.86">
    <stop offset="0"   stop-color="#FFF8EA"/>
    <stop offset="0.6" stop-color="#F6E6C9"/>
    <stop offset="1"   stop-color="#E4CDA6"/>
  </radialGradient>
  <linearGradient id="slat" x1="0" y1="0" x2="1" y2="0.2">
    <stop offset="0" stop-color="#D3B383"/><stop offset="0.5" stop-color="#C09A67"/><stop offset="1" stop-color="#A9844F"/>
  </linearGradient>

  <!-- ===== 大理石 ===== -->
  <linearGradient id="marble" x1="0.1" y1="0" x2="0.55" y2="1">
    <stop offset="0"    stop-color="#FDF6E9"/>
    <stop offset="0.3"  stop-color="#F6EAD6"/>
    <stop offset="0.72" stop-color="#E9D7B9"/>
    <stop offset="1"    stop-color="#D8C09B"/>
  </linearGradient>
  <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <!-- ===== 人物の陰影 ===== -->
  <linearGradient id="skin" x1="0.12" y1="0.05" x2="0.9" y2="0.95">
    <stop offset="0"    stop-color="#F6DCC3"/>
    <stop offset="0.48" stop-color="#EBCBAE"/>
    <stop offset="1"    stop-color="#D2A785"/>
  </linearGradient>
  <linearGradient id="skinArm" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#F3D7BD"/><stop offset="1" stop-color="#D6AC8B"/>
  </linearGradient>
  <linearGradient id="blazer" x1="0.1" y1="0" x2="0.85" y2="1">
    <stop offset="0"    stop-color="#F4E9D7"/>
    <stop offset="0.45" stop-color="#E2D1B6"/>
    <stop offset="1"    stop-color="#BCA482"/>
  </linearGradient>
  <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBF4E8"/><stop offset="1" stop-color="#E3D4BA"/>
  </linearGradient>
  <linearGradient id="inner" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#EADCC6"/><stop offset="1" stop-color="#CDB795"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0.15" y1="0.05" x2="0.85" y2="1">
    <stop offset="0" stop-color="#6B4E37"/><stop offset="0.5" stop-color="#503A28"/><stop offset="1" stop-color="#3B2A1D"/>
  </linearGradient>

  <!-- ===== 什器 ===== -->
  <linearGradient id="laptopLid" x1="0.15" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#F2EADA"/><stop offset="0.5" stop-color="#DCD1BB"/><stop offset="1" stop-color="#B8AB90"/>
  </linearGradient>
  <linearGradient id="glassBottle" x1="0" y1="0" x2="1" y2="0.3">
    <stop offset="0" stop-color="#FFFCF6" stop-opacity="0.97"/><stop offset="0.55" stop-color="#F4EADA" stop-opacity="0.9"/><stop offset="1" stop-color="#E2D2B9" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EBD3A4"/><stop offset="0.4" stop-color="#C9A86E"/><stop offset="0.72" stop-color="#B08E52"/><stop offset="1" stop-color="#DCC190"/>
  </linearGradient>
  <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7E9463"/><stop offset="1" stop-color="#5A6E42"/>
  </linearGradient>

  <!-- ===== フィルタ ===== -->
  <filter id="farBlur" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="midBlur" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="castShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feDropShadow dx="14" dy="22" stdDeviation="24" flood-color="#6E5433" flood-opacity="0.3"/>
  </filter>
  <filter id="propShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#7A5E3B" flood-opacity="0.26"/>
  </filter>
  <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/>
  </filter>
  <radialGradient id="vignette" cx="0.44" cy="0.4" r="0.82">
    <stop offset="0.42" stop-color="#4A3418" stop-opacity="0"/><stop offset="1" stop-color="#4A3418" stop-opacity="0.34"/>
  </radialGradient>
  <linearGradient id="floorFall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7A5A2E" stop-opacity="0"/><stop offset="1" stop-color="#7A5A2E" stop-opacity="0.16"/>
  </linearGradient>
</defs>

<!-- ============ 背景の壁と光 ============ -->
<rect width="1600" height="1340" fill="url(#wall)"/>
<rect width="1600" height="1340" fill="url(#keylight)"/>

