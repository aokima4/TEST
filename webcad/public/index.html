<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314161a'/%3E%3Cpath d='M6 24 L16 8 L26 24' fill='none' stroke='%2359d0ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='19' r='3' fill='none' stroke='%23ffd24a' stroke-width='2'/%3E%3C/svg%3E">
<meta name="description" content="ブラウザだけで動く機械部品用の2D CAD。内部は1マイクロメートル整数で誤差ゼロ、DXF・PDF出力に対応。">
<title>WebCAD 2D</title>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --panel2:#22262d; --line:#2e333c;
  --fg:#e6e9ef; --fg2:#9aa3b0; --acc:#59d0ff; --acc2:#ffd24a;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff4d4d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:13px;overflow:hidden}
button{font-family:inherit}
#app{display:grid;grid-template-rows:44px 1fr 76px;height:100%}
#toolbar{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.brandsub{font-weight:400;font-size:11px;color:var(--fg2)}
.tbgroup{display:flex;gap:4px;padding-left:10px;border-left:1px solid var(--line)}
.tb{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 9px;cursor:pointer;font-size:12px}
.tb:hover{background:#2b313a;border-color:#3b424e}
.spacer{flex:1}
.docinfo{display:flex;align-items:center;gap:8px}
.docname{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:5px 8px;width:180px}
.savestate{font-size:11px;color:var(--fg2);min-width:120px;text-align:right}

#main{display:grid;grid-template-columns:112px 1fr 320px;min-height:0}
#tools{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px}
.toolgroup{font-size:10px;color:var(--fg2);margin:8px 0 4px;letter-spacing:.08em}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;color:var(--fg);padding:5px 2px;cursor:pointer}
.tool:hover{background:#2b313a;border-color:var(--acc)}
.tool.active{border-color:var(--acc2)}
.ticon{font-size:15px;line-height:1}
.tlabel{font-size:9px;color:var(--fg2);text-align:center;line-height:1.15}

#canvasWrap{position:relative;min-width:0;min-height:0}
#canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:60px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--fg2);padding:8px 4px;cursor:pointer;font-size:11px}
.tab.active{color:var(--fg);border-bottom-color:var(--acc)}
.panelbody{flex:1;overflow-y:auto;padding:10px}
.stack{display:flex;flex-direction:column;gap:7px}
.field{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:6px}
.field>span:first-child{color:var(--fg2);font-size:11px}
.num,.txt,.sel,.vname,.vexpr,.lname{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:5px 6px;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.num:focus,.txt:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.unit{color:var(--fg2);font-size:11px}
.hint{color:var(--fg2);font-size:11px;line-height:1.6;margin:2px 0}
.proptitle{font-weight:700;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:5px}
.eid{font-size:10px;color:var(--fg2);font-family:ui-monospace,monospace}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.kv>div:nth-child(odd){color:var(--fg2)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:7px;cursor:pointer}
.btn:hover{background:#2b313a}
.btn.danger{border-color:#5a2b2b;color:#ff9c9c}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.layers{display:flex;flex-direction:column;gap:3px}
.layerrow{display:grid;grid-template-columns:22px 22px 22px 26px 1fr 62px 52px 22px;gap:3px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px}
.layerrow.cur{border-color:var(--acc)}
.lbtn{background:transparent;border:0;color:var(--fg2);cursor:pointer;font-size:12px;padding:2px}
.lbtn.danger{color:#ff8080}
.lcolor{width:24px;height:22px;border:0;background:transparent;padding:0}
.lname{font-size:11px;padding:3px 4px}
.lsel{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:4px;font-size:10px;padding:2px}

.dofbar{display:flex;gap:5px}
.dof{flex:1;text-align:center;border-radius:4px;padding:5px 2px;font-size:10px;border:1px solid var(--line)}
.dof.under{color:#4a9bff;border-color:#26415f}
.dof.full{color:var(--ok);border-color:#1f5138}
.dof.over{color:var(--bad);border-color:#5f2626}
.alert{background:#3a1f1f;border:1px solid #5f2626;border-radius:5px;padding:8px;font-size:11px;line-height:1.6}
.clist{display:flex;flex-direction:column;gap:3px}
.crow{display:grid;grid-template-columns:62px 1fr 1fr 40px 22px;gap:4px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:4px;font-size:11px}
.crow.bad{border-color:var(--bad);background:#2c1c1c}
.cids{color:var(--fg2);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cval{font-family:ui-monospace,monospace;font-size:11px}

.vars{display:flex;flex-direction:column;gap:3px}
.varrow{display:grid;grid-template-columns:1fr 10px 1.3fr 84px 22px;gap:4px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:3px}
.varrow.bad{border-color:var(--bad)}
.vval{font-size:10px;color:var(--fg2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bom{width:100%;border-collapse:collapse;font-size:11px}
.bom th,.bom td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.bom th{background:var(--panel2);color:var(--fg2)}

#statusbar{background:var(--panel);border-top:1px solid var(--line);display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:5px;padding:6px 10px;align-items:center}
.promptline{grid-column:1/3;color:var(--acc2);font-size:12px;min-height:16px}
.cmdline{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:7px 9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.cmdline:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.statusgroup{display:flex;gap:4px;align-items:center;justify-self:end;position:relative}
.toggle{background:var(--panel2);border:1px solid var(--line);color:var(--fg2);border-radius:4px;padding:5px 7px;cursor:pointer;font-size:11px}
.toggle.on{color:#07130d;background:var(--ok);border-color:var(--ok)}
.snapwrap{position:relative}
.snapmenu{display:none;position:absolute;bottom:32px;right:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:8px;flex-direction:column;gap:5px;z-index:20;min-width:130px}
.snapmenu.open{display:flex}
.snapitem{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--fg)}
.coords{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg)}
.perf{font-size:10px;color:var(--fg2);justify-self:end}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="main">
    <div id="tools"></div>
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <div id="panel"></div>
  </div>
  <div id="statusbar"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
